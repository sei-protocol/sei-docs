extends: capitalization
message: "Use sentence case for headings: '%s'."
link: https://github.com/sei-protocol/sei-docs/blob/main/AGENTS.md
level: warning
scope: heading
# AGENTS.md: "Sentence case for headings." Only the first word and proper nouns
# are capitalized. Proper nouns below are exempt so they may appear mid-heading.
match: $sentence
# A colon starts a new sentence, so "Step 1: Evaluate compatibility" is still
# sentence case.
indicators:
  - ':'
exceptions:
  - Sei
  - Sei Giga
  - Sei EVM
  - Sei Network
  - Sei Mainnet
  - Sei Testnet
  - SeiDB
  - EVM
  - ERC
  - CosmWasm
  - Cosmos
  - Ethereum
  - Ethereum Mainnet
  - Arbitrum
  # Scoped to the migration heading so the rule still catches "Base fee" and
  # "Base layer" elsewhere.
  - Migrating from Base
  - Polygon PoS
  - Avalanche C-Chain
  - LayerZero V2
  - Uniswap V3
  - Solidity
  - Hardhat
  - Foundry
  - MetaMask
  - Compass
  - Rabby
  - Ledger
  - Twin Turbo Consensus
  - Autobahn
  - Pectra
  - RPC
  - API
  - CLI
  - SDK
  - NFT
  - VRF
  - JSON
  - RocksDB
  - StateSync
  - IPv4
  - IPv6
  - I
