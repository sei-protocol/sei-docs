name: Validate docs

on:
  pull_request:
  workflow_dispatch:

defaults:
  run:
    shell: bash

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate docs.json is valid JSON
        run: jq empty docs.json

      - name: Enforce generated-only agent skills
        run: |
          set -euo pipefail
          # .mintlify/skills/ is GENERATED from sei-protocol/sei-skill by
          # scripts/build-mintlify-skills.mjs (see .github/workflows/sync-skills.yml).
          # Hand-authored skill content is not allowed in this repo, and the
          # registry at /ai/skills must list exactly the skills that install.
          shopt -s nullglob
          skills=(.mintlify/skills/*/SKILL.md)
          if [[ ${#skills[@]} -eq 0 ]]; then
            echo "::error::No skills under .mintlify/skills/. The registry at /ai/skills would list skills that don't install."
            exit 1
          fi
          bad=0
          for f in "${skills[@]}"; do
            dir=$(basename "$(dirname "$f")")
            if ! grep -q 'GENERATED FROM sei-protocol/sei-skill' "$f"; then
              echo "::error file=$f::Missing 'GENERATED FROM sei-protocol/sei-skill' marker. Edit the source in sei-skill and regenerate; do not hand-author skills here."
              bad=$((bad+1))
            fi
            if ! grep -qx "name: ${dir}" "$f"; then
              echo "::error file=$f::Frontmatter name must be '${dir}' to match its directory."
              bad=$((bad+1))
            fi
          done
          registry=$(grep -oE "id: '[a-z0-9-]+'" snippets/skills-registry.jsx | cut -d"'" -f2 | sort || true)
          installed=$(for f in "${skills[@]}"; do basename "$(dirname "$f")"; done | sort)
          if [[ "$registry" != "$installed" ]]; then
            echo "::error file=snippets/skills-registry.jsx::Registry cards don't match .mintlify/skills/."
            diff <(echo "$registry") <(echo "$installed") || true
            bad=$((bad+1))
          fi
          if [[ "$bad" -gt 0 ]]; then
            exit 1
          fi
          echo "All ${#skills[@]} skills carry the generated marker and match the registry."

      - name: Validate snippet theme defaults
        run: node scripts/check-snippet-theme-default.mjs

      - name: Verify all referenced pages exist
        run: |
          set -euo pipefail
          missing=0
          # Extract every page reference from docs.json (strings within "pages": [...]).
          # Pages are written as "evm/networks" → ./evm/networks.mdx must exist.
          mapfile -t pages < <(jq -r '
            .. | objects |
            select(has("pages")) |
            .pages[] |
            if type == "string" then . else empty end
          ' docs.json)
          for p in "${pages[@]}"; do
            if [[ ! -f "${p}.mdx" && ! -f "${p}.md" ]]; then
              echo "::error::Missing page referenced in docs.json: ${p}"
              missing=$((missing+1))
            fi
          done
          if [[ "$missing" -gt 0 ]]; then
            echo "$missing missing page(s)"
            exit 1
          fi
          echo "All ${#pages[@]} referenced pages exist."

      - name: Verify redirect destinations exist
        run: node scripts/check-redirects.mjs

      - name: Find orphaned MDX files (not in nav)
        run: |
          set -euo pipefail
          mapfile -t referenced < <(jq -r '
            .. | objects |
            select(has("pages")) |
            .pages[] |
            if type == "string" then . else empty end
          ' docs.json | sort -u)
          # index.mdx is the homepage and not required to be in nav
          orphans=0
          while IFS= read -r f; do
            slug="${f#./}"
            slug="${slug%.mdx}"
            if [[ "$slug" == "index" ]]; then continue; fi
            if ! printf '%s\n' "${referenced[@]}" | grep -qx "$slug"; then
              echo "::warning::Orphan MDX (not referenced in docs.json nav): $f"
              orphans=$((orphans+1))
            fi
          done < <(find . -name '*.mdx' -not -path './node_modules/*' -not -path './.git/*')
          echo "$orphans orphan MDX file(s) (warnings only)."
